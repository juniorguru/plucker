[project]
name = "jg.plucker"
version = "0.0.1"
description = "Junior Guru scrapers"
readme = "README.md"
authors = [{name = "Honza Javorek", email = "honza@junior.guru"}]
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.15,<3.16"
dependencies = [
    "apify[scrapy]>=4.1.0",
    "apify-client>=3.3.0",  # deployment of actors, monitoring, automation
    "apify-shared",  # importing a few enums
    "click>=8.3.2",
    "diskcache>=5.6.3",
    "favicon>=0.7.0",
    "ics>=0.8.0.dev0",
    "lxml>=6.0.4",
    "pillow>=12.2.0",
    "pydantic>=2.13.0",
    "scrapy>=2.15.0",
    "teemup>=1.2.2",
    "scrapy-impersonate>=1.7.0",
]

[project.urls]
homepage = "https://junior.guru/"
repository = "https://github.com/juniorguru/plucker"

[project.scripts]
plucker = "jg.plucker.cli:main"

[dependency-groups]
dev = [
    "cookiecutter>=2.7.1",
    "pytest>=9.0.3",
    "pytest-ruff>=0.5",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests", "src"]  # src for ruff checks
pythonpath = ["."]  # allows importing helpers from tests.utils
addopts = "--import-mode=importlib --ff --ruff --ruff-format"

[tool.ruff]
target-version = "py315"
extend-exclude = ["scraper_template"]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "RUF012",  # Scrapy configures spiders through mutable class attributes
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[build-system]
requires = ["uv_build>=0.11.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jg.plucker"

[tool.uv]
# apify-client 3.3.0 pins impit~=0.14.0, which has no Python 3.15 wheels;
# remove once a stable apify-client allows impit>=0.15
override-dependencies = ["impit>=0.15.0"]
