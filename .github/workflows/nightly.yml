name: nightly

on:
  schedule:
    - cron: "17 17 * * *"  # every day at 17:17 UTC, GitHub often starts it hours late
  workflow_dispatch:  # allows manual triggering of the workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: uv run plucker build

      - name: Check
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: uv run plucker check --logs-dir=apify-logs

      - name: Upload failure logs
        if: failure()
        id: upload-logs
        uses: actions/upload-artifact@v7
        with:
          name: apify-failure-logs
          path: apify-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Announce failure logs
        if: failure() && steps.upload-logs.outputs.artifact-url != ''
        run: |
          url="${{ steps.upload-logs.outputs.artifact-url }}"
          echo "::notice::Logs from the failing scraper runs are attached to this run as the 'apify-failure-logs' artifact: $url"
          {
            echo "### Apify failure logs"
            echo ""
            echo "Full logs from the failing scraper runs are attached to this run as the **apify-failure-logs** artifact:"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
